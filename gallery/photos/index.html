<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photos — Cino.</title>
    <link rel="stylesheet" href="../../style.css">
</head>

<body>

<div class="wrap">

    <div class="top">
        <div>
            <div class="brand">Cino.</div>
            <h1 class="page-title">Photos</h1>
            <p class="sub">Your photos are stored locally in this browser.</p>
        </div>

        <div class="actions">
            <label class="btn" for="photoInput">＋ Add photos</label>
            <a class="back" href="../../home/">Back</a>
        </div>
    </div>

    <input
        id="photoInput"
        type="file"
        accept="image/*"
        multiple
    >

    <div id="grid" class="grid"></div>

</div>

<!-- Fullscreen viewer -->
<div id="viewer" class="viewer">
    <button class="close" id="closeViewer">×</button>
    <img id="viewerImage" alt="Photo">
</div>

<script>
const DB_NAME = "CinoGalleryDB";
const DB_VERSION = 1;
const STORE_NAME = "photos";

let db;
let objectUrls = [];

/* =========================
   OPEN DATABASE
========================= */

function openDatabase() {
    return new Promise((resolve, reject) => {
        const request = indexedDB.open(DB_NAME, DB_VERSION);

        request.onupgradeneeded = event => {
            const database = event.target.result;

            if (!database.objectStoreNames.contains(STORE_NAME)) {
                database.createObjectStore(STORE_NAME, {
                    keyPath: "id",
                    autoIncrement: true
                });
            }
        };

        request.onsuccess = event => {
            db = event.target.result;
            resolve(db);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

/* =========================
   DATABASE HELPERS
========================= */

function getPhotos() {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readonly");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.getAll();

        request.onsuccess = () => {
            resolve(request.result);
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

function addPhoto(photo) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.add(photo);

        request.onsuccess = () => {
            resolve();
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

function deletePhoto(id) {
    return new Promise((resolve, reject) => {
        const transaction = db.transaction(STORE_NAME, "readwrite");
        const store = transaction.objectStore(STORE_NAME);
        const request = store.delete(id);

        request.onsuccess = () => {
            resolve();
        };

        request.onerror = () => {
            reject(request.error);
        };
    });
}

/* =========================
   RENDER PHOTOS
========================= */

async function renderPhotos() {

    const grid = document.getElementById("grid");

    objectUrls.forEach(url => URL.revokeObjectURL(url));
    objectUrls = [];

    const photos = await getPhotos();

    grid.innerHTML = "";

    if (photos.length === 0) {
        grid.innerHTML = `
            <div class="empty">
                No photos yet.<br>
                Click "＋ Add photos" to upload some.
            </div>
        `;
        return;
    }

    photos.sort((a, b) => b.createdAt - a.createdAt);

    photos.forEach(photo => {

        const item = document.createElement("div");
        item.className = "item";

        const img = document.createElement("img");

        const url = URL.createObjectURL(photo.blob);
        objectUrls.push(url);

        img.src = url;
        img.alt = photo.name || "Photo";

        img.addEventListener("click", () => {
            openViewer(url);
        });

        const deleteButton = document.createElement("button");

        deleteButton.className = "delete";
        deleteButton.textContent = "×";
        deleteButton.title = "Delete photo";

        deleteButton.addEventListener("click", async event => {
            event.stopPropagation();

            await deletePhoto(photo.id);
            renderPhotos();
        });

        item.appendChild(img);
        item.appendChild(deleteButton);

        grid.appendChild(item);
    });
}

/* =========================
   UPLOAD
========================= */

document.getElementById("photoInput").addEventListener("change", async event => {

    const files = Array.from(event.target.files);

    for (const file of files) {

        if (!file.type.startsWith("image/")) {
            continue;
        }

        await addPhoto({
            name: file.name,
            blob: file,
            createdAt: Date.now()
        });
    }

    event.target.value = "";

    renderPhotos();
});

/* =========================
   FULLSCREEN VIEWER
========================= */

const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");

function openViewer(url) {
    viewerImage.src = url;
    viewer.classList.add("open");
}

function closeViewer() {
    viewer.classList.remove("open");
    viewerImage.src = "";
}

document.getElementById("closeViewer").addEventListener("click", closeViewer);

viewer.addEventListener("click", event => {
    if (event.target === viewer) {
        closeViewer();
    }
});

document.addEventListener("keydown", event => {
    if (event.key === "Escape") {
        closeViewer();
    }
});

/* =========================
   MIGRATE OLD PHOTOS
   From localStorage → IndexedDB
========================= */

async function migrateOldPhotos() {

    const oldData = localStorage.getItem("cinoPhotos");

    if (!oldData) {
        return;
    }

    try {

        const oldPhotos = JSON.parse(oldData);

        if (!Array.isArray(oldPhotos) || oldPhotos.length === 0) {
            localStorage.removeItem("cinoPhotos");
            return;
        }

        const existingPhotos = await getPhotos();

        if (existingPhotos.length === 0) {

            for (const oldPhoto of oldPhotos) {

                if (!oldPhoto.data) {
                    continue;
                }

                try {

                    const response = await fetch(oldPhoto.data);
                    const blob = await response.blob();

                    await addPhoto({
                        name: oldPhoto.name || "Old photo",
                        blob: blob,
                        createdAt: oldPhoto.createdAt || Date.now()
                    });

                } catch (error) {
                    console.error(
                        "Could not migrate photo:",
                        error
                    );
                }
            }
        }

        /*
         * Free the old localStorage space
         */
        localStorage.removeItem("cinoPhotos");

    } catch (error) {

        console.error(
            "Could not migrate old photos:",
            error
        );
    }
}

/* =========================
   START
========================= */

async function start() {

    try {

        await openDatabase();

        await migrateOldPhotos();

        await renderPhotos();

    } catch (error) {

        console.error(error);

        document.getElementById("grid").innerHTML = `
            <div class="empty">
                Your browser could not open the photo database.
            </div>
        `;
    }
}

start();

</script>

</body>
</html>
