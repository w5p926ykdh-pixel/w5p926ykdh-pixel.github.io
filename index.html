<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cino Gallery</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #0b0b0f;
    color: #f5f5f7;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
}

header {
    padding: 28px 6%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(11,11,15,.8);
    backdrop-filter: blur(18px);
    border-bottom: 1px solid #202027;
}

.logo {
    font-size: 24px;
    font-weight: 700;
}

.upload {
    background: #fff;
    color: #000;
    border: 0;
    border-radius: 12px;
    padding: 11px 18px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform .2s, opacity .2s;
}

.upload:hover {
    transform: translateY(-2px);
    opacity: .85;
}

main {
    padding: 45px 6%;
}

.hero {
    margin-bottom: 35px;
}

.hero h1 {
    font-size: clamp(35px, 6vw, 65px);
    margin: 0 0 10px;
    letter-spacing: -2px;
}

.hero p {
    color: #8b8b96;
    margin: 0;
}

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 18px;
}

.card {
    position: relative;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    border-radius: 18px;
    background: #15151b;
    cursor: pointer;
    animation: appear .45s ease both;
    transition: transform .3s ease, box-shadow .3s ease;
}

.card:hover {
    transform: translateY(-5px) scale(1.01);
    box-shadow: 0 15px 40px rgba(0,0,0,.45);
}

.card img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform .5s ease;
}

.card:hover img {
    transform: scale(1.06);
}

.delete {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 34px;
    height: 34px;
    border: 0;
    border-radius: 50%;
    background: rgba(0,0,0,.7);
    color: white;
    cursor: pointer;
    opacity: 0;
    transition: opacity .2s;
}

.card:hover .delete {
    opacity: 1;
}

.empty {
    text-align: center;
    padding: 100px 20px;
    color: #666672;
}

.empty div {
    font-size: 55px;
    margin-bottom: 15px;
}

input[type="file"] {
    display: none;
}

/* Fullscreen viewer */

.viewer {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.92);
    backdrop-filter: blur(15px);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px;
    z-index: 100;
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease;
}

.viewer.active {
    opacity: 1;
    pointer-events: auto;
}

.viewer img {
    max-width: 95%;
    max-height: 90vh;
    object-fit: contain;
    border-radius: 14px;
    transform: scale(.95);
    transition: transform .35s ease;
}

.viewer.active img {
    transform: scale(1);
}

.close {
    position: fixed;
    top: 25px;
    right: 30px;
    width: 45px;
    height: 45px;
    border: 0;
    border-radius: 50%;
    background: rgba(255,255,255,.1);
    color: white;
    font-size: 25px;
    cursor: pointer;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: translateY(15px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

@media (max-width: 600px) {
    header {
        padding: 20px;
    }

    main {
        padding: 30px 20px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .card {
        border-radius: 12px;
    }
}
</style>
</head>

<body>

<header>
    <div class="logo">Cino.</div>

    <label class="upload">
        + Upload
        <input id="fileInput" type="file" accept="image/*" multiple>
    </label>
</header>

<main>

    <section class="hero">
        <h1>Your Gallery</h1>
        <p>Your images, stored locally in your browser.</p>
    </section>

    <section id="gallery" class="gallery"></section>

</main>

<div id="viewer" class="viewer">
    <button class="close" onclick="closeViewer()">×</button>
    <img id="viewerImage">
</div>

<script>
const input = document.getElementById("fileInput");
const gallery = document.getElementById("gallery");
const viewer = document.getElementById("viewer");
const viewerImage = document.getElementById("viewerImage");

let images = JSON.parse(localStorage.getItem("cinoImages") || "[]");

function save() {
    localStorage.setItem("cinoImages", JSON.stringify(images));
}

function render() {
    gallery.innerHTML = "";

    if (images.length === 0) {
        gallery.innerHTML = `
            <div class="empty">
                <div>＋</div>
                <p>Upload some images to get started.</p>
            </div>
        `;
        return;
    }

    images.forEach((src, index) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <img src="${src}">
            <button class="delete">×</button>
        `;

        card.querySelector("img").onclick = () => openViewer(src);

        card.querySelector(".delete").onclick = (e) => {
            e.stopPropagation();
            images.splice(index, 1);
            save();
            render();
        };

        gallery.appendChild(card);
    });
}

input.addEventListener("change", event => {
    const files = [...event.target.files];

    files.forEach(file => {
        const reader = new FileReader();

        reader.onload = e => {
            images.push(e.target.result);
            save();
            render();
        };

        reader.readAsDataURL(file);
    });

    input.value = "";
});

function openViewer(src) {
    viewerImage.src = src;
    viewer.classList.add("active");
}

function closeViewer() {
    viewer.classList.remove("active");
}

viewer.addEventListener("click", e => {
    if (e.target === viewer) closeViewer();
});

document.addEventListener("keydown", e => {
    if (e.key === "Escape") closeViewer();
});

render();
</script>

</body>
</html>
