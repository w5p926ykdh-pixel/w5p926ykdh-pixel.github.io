<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cino. — Photos</title><link rel="stylesheet" href="/style.css"></head>
<body><main class="wrap"><header class="top"><div><h1 class="page-title">Photos</h1><p class="sub">Your photo gallery.</p></div><div class="actions"><a class="back" href="/home/">Home</a><button class="btn" id="upload">+ Upload</button><button class="btn" id="clear">Clear</button><input id="file" type="file" accept="image/*" multiple></div></header><section id="grid" class="grid"></section></main><div id="viewer" class="viewer"><button id="close" class="close">×</button><div id="viewerContent"></div></div><script>
function getItems(key){try{return JSON.parse(localStorage.getItem(key)||"[]")}catch{return[]}}
function saveItems(key,items){localStorage.setItem(key,JSON.stringify(items))}
function setupGallery({key,type}) {
  const grid=document.querySelector("#grid"), input=document.querySelector("#file"), viewer=document.querySelector("#viewer"), content=document.querySelector("#viewerContent");
  function render(){
    const items=getItems(key); grid.innerHTML="";
    if(!items.length){grid.innerHTML='<div class="empty">Nothing here yet. Use + Upload to add files.</div>';return}
    items.forEach((item,i)=>{
      const card=document.createElement("article"); card.className="item";
      const media=document.createElement(type==="image"?"img":"video");
      media.src=item.data; media.title=item.name||"Open"; if(type==="video"){media.muted=true;media.playsInline=true;media.preload="metadata"}
      media.onclick=()=>{content.innerHTML="";const v=document.createElement(type==="image"?"img":"video");v.src=item.data;if(type==="video"){v.controls=true;v.autoplay=true;v.playsInline=true}content.appendChild(v);viewer.classList.add("open")};
      const del=document.createElement("button");del.className="delete";del.textContent="×";del.onclick=(e)=>{e.stopPropagation();if(confirm("Delete this file?")){const a=getItems(key);a.splice(i,1);saveItems(key,a);render()}};
      card.append(media,del);grid.appendChild(card);
    });
  }
  input.onchange=async()=>{
    const files=[...input.files]; if(!files.length)return;
    const current=getItems(key);
    for(const file of files){
      if(type==="image"&&!file.type.startsWith("image/"))continue;
      if(type==="video"&&!file.type.startsWith("video/"))continue;
      const data=await new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)});
      current.push({name:file.name,data});
    }
    saveItems(key,current);input.value="";render();
  };
  document.querySelector("#upload").onclick=()=>input.click();
  document.querySelector("#clear").onclick=()=>{if(confirm("Delete everything in this gallery?")){localStorage.removeItem(key);render()}};
  document.querySelector("#close").onclick=()=>{viewer.classList.remove("open");content.innerHTML=""};
  viewer.onclick=e=>{if(e.target===viewer){viewer.classList.remove("open");content.innerHTML=""}};
  render();
}
</script><script>setupGallery({key:"cino.photos",type:"image"})</script></body></html>
