<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Cino. — Home</title>

<style>

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    background: #08090c;
}

body {
    min-height: 100vh;

    color: #f5f7fb;

    font-family:
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    display: flex;
    flex-direction: column;

    overflow-x: hidden;
}


/* =========================
   MAIN
========================= */

main {
    flex: 1;

    display: flex;
    flex-direction: column;

    align-items: center;

    padding-top: 155px;

    /*
       Leave room for the fixed footer
       so the content does not overlap it.
    */
    padding-bottom: 110px;
}


/* =========================
   HERO
========================= */

.hero {
    text-align: center;
}

.brand {
    font-size: 28px;
    font-weight: 400;

    line-height: 1;

    margin-bottom: 10px;
}

.hero h1 {
    margin: 0;

    font-size: clamp(60px, 7vw, 82px);

    line-height: 0.95;

    letter-spacing: -5px;

    font-weight: 800;
}

.hero p {
    margin: 32px 0 0;

    color: #8d94a3;

    font-size: 18px;
}


/* =========================
   CHOICES
========================= */

.choices {
    display: flex;

    justify-content: center;

    gap: 32px;

    width: 100%;

    margin-top: 58px;

    padding: 0 30px;
}

.choice {
    width: 300px;
    height: 210px;

    display: flex;

    flex-direction: column;

    align-items: center;
    justify-content: center;

    gap: 25px;

    background: #111318;

    border: 1px solid #292c35;

    border-radius: 25px;

    color: #f5f7fb;

    text-decoration: none;

    transition:
        transform 0.2s ease,
        background 0.2s ease,
        border-color 0.2s ease;
}

.choice:hover {
    transform: translateY(-5px);

    background: #171922;

    border-color: #3a3e4a;
}


/* =========================
   ICONS
========================= */

.icon {
    display: flex;

    align-items: center;
    justify-content: center;

    height: 48px;

    font-size: 42px;

    line-height: 1;
}

.choice-name {
    font-size: 22px;

    font-weight: 700;
}


/* =========================
   FIXED FOOTER
========================= */

footer {
    position: fixed;

    left: 0;
    bottom: 0;

    width: 100%;
    height: 82px;

    display: flex;

    align-items: center;
    justify-content: space-between;

    padding: 0 28px;

    background: #000;

    z-index: 100;
}

.email {
    color: #252525;

    font-family:
        Georgia,
        "Times New Roman",
        serif;

    font-size: 25px;

    user-select: none;
}

.cino-logo {
    color: #075a9d;

    font-family:
        "Courier New",
        monospace;

    font-size: 42px;

    font-weight: 900;

    letter-spacing: 8px;

    transform: rotate(-2deg);

    user-select: none;
}


/* =========================
   TABLET / MOBILE
========================= */

@media (max-width: 950px) {

    main {
        padding-top: 100px;
        padding-bottom: 100px;
    }

    .choices {
        flex-direction: column;

        align-items: center;

        gap: 18px;
    }

    .choice {
        width: min(500px, 100%);
        height: 150px;
    }

    footer {
        height: 70px;

        padding: 0 18px;
    }

    .email {
        font-size: 17px;
    }

    .cino-logo {
        font-size: 28px;

        letter-spacing: 5px;
    }
}


/* =========================
   SMALL PHONES
========================= */

@media (max-width: 500px) {

    main {
        padding-top: 75px;
        padding-bottom: 90px;
    }

    .hero h1 {
        font-size: 58px;

        letter-spacing: -4px;
    }

    .brand {
        font-size: 24px;
    }

    .hero p {
        margin-top: 24px;

        font-size: 16px;
    }

    .choices {
        margin-top: 45px;

        padding: 0 18px;
    }

    .choice {
        height: 130px;

        border-radius: 20px;

        gap: 15px;
    }

    .icon {
        font-size: 36px;
    }

    .choice-name {
        font-size: 19px;
    }

    footer {
        height: 65px;

        padding: 0 14px;
    }

    .email {
        font-size: 14px;
    }

    .cino-logo {
        font-size: 23px;

        letter-spacing: 3px;
    }
}

</style>
</head>


<body>

<main>

    <section class="hero">

        <div class="brand">
            Cino.
        </div>

        <h1>
            Welcome.
        </h1>

        <p>
            Your personal gallery.
        </p>

    </section>


    <section class="choices">

        <a
            class="choice"
            href="../gallery/info-copyandpaste/"
        >
            <span class="icon">🔗</span>

            <span class="choice-name">
                Info &amp; Links
            </span>
        </a>


        <a
            class="choice"
            href="../gallery/photos/"
        >
            <span class="icon">▧</span>

            <span class="choice-name">
                Photos
            </span>
        </a>


        <a
            class="choice"
            href="../gallery/videos/"
        >
            <span class="icon">▶</span>

            <span class="choice-name">
                Videos
            </span>
        </a>

    </section>

</main>


<footer>

    <div class="email">
        the@cino.pntr.dev
    </div>

    <div class="cino-logo">
        CINO
    </div>

</footer>


</body>
</html>
