<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>404 — Cino.</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #080809;
      color: #f5f5f7;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      text-align: center;
      padding: 24px;
    }
    main { max-width: 520px; }
    .brand {
      font-size: 20px;
      margin-bottom: 48px;
    }
    h1 {
      font-size: clamp(80px, 20vw, 140px);
      line-height: 1;
      letter-spacing: -0.09em;
      margin: 0;
      font-weight: 750;
    }
    h2 {
      font-size: 24px;
      margin: 24px 0 12px;
    }
    p {
      color: #92929d;
      line-height: 1.6;
      margin-bottom: 30px;
    }
    a {
      display: inline-block;
      padding: 13px 22px;
      border: 1px solid #303038;
      border-radius: 14px;
      background: #151519;
      color: #fff;
      text-decoration: none;
      transition: background .2s;
    }
    a:hover { background: #25252c; }
    footer {
      position: fixed;
      bottom: 22px;
      color: #666670;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <main>
    <div class="brand">Cino.</div>
